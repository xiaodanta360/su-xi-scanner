name: Build APK v2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip \
            openjdk-17-jdk \
            libz-dev libssl-dev libffi-dev \
            autoconf automake libtool cmake pkg-config \
            ninja-build ccache

      - name: Install python packages
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build APK
        run: |
          set +e
          yes | buildozer -v android debug > build.log 2>&1
          code=$?
          echo "===== 退出码: $code ====="
          echo "===== Gradle 错误详情 ====="
          grep -n -B 3 -A 40 -i "FAILURE:\|What went wrong\|Caused by:\|Execution failed for task" build.log | head -150
          echo "===== 最后 60 行 ====="
          tail -60 build.log
          exit $code

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
