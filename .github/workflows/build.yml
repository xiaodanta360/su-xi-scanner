name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip patchelf autoconf automake libtool \
            pkg-config cmake ninja-build ccache \
            openjdk-17-jdk \
            zlib1g-dev libssl-dev libffi-dev \
            libjpeg-dev libpng-dev libfreetype-dev \
            libncurses5

      - name: Install python packages
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build APK
        env:
          MAKEFLAGS: "-j1"
          JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"
        run: |
          set +e
          yes | buildozer android debug --allow-minsdk-ndkapi-mismatch 2>&1 | tee build.log
          code=${PIPESTATUS[0]}

          echo ""
          echo "===== 退出码: $code ====="

          if [ "$code" -ne 0 ]; then
            echo "===== 关键错误行 ====="
            grep -n -i -E "error:|FAILURE|What went wrong|Killed|No such file|failed|Traceback|undefined reference|Could not" build.log | tail -60
            echo ""
            echo "===== 最后 120 行 ====="
            tail -120 build.log
          fi

          exit $code

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk

