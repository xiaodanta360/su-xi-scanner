name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git libssl-dev openjdk-17-jdk zip unzip autoconf libtool pkg-config zlib1g-dev libffi-dev cmake

      - name: Install python packages
        run: |
          pip install --upgrade pip setuptools wheel cython buildozer

      - name: Build APK
        env:
          ACCEPT_SHARED_SDK_LICENSE: 1
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myav-apk
          path: bin/*.apk

